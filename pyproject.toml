[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvkit-python"
version = "0.1.1"
description = "A computer vision toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Haruka" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "tqdm>=4.67.1",
    "opencv-python>=4.7.0.72",
    "numpy>=1.23.0"
]

[project.urls]
Homepage = "https://github.com/AsahinaHaruka/CVkit"


[project.optional-dependencies]
onnx-core = [
    "onnx>=1.19.1",
    "onnxslim>=0.1.74",
]
onnx-cpu = [
    "cvkit-python[onnx-core]",
    "onnxruntime>=1.23.2"
]
onnx-gpu = [
    "cvkit-python[onnx-core]",
    "onnxruntime-gpu>=1.23.2"
]
sam = [
    "regex"
]

[project.scripts]
cvkit-color-to-gray = "cvkit.color_to_gray:main"
cvkit-data-split = "cvkit.data_split:main"
cvkit-random-selection = "cvkit.random_selection:main"
cvkit-show-yolo-obj = "cvkit.show_yolo_obj_image:main_cli"
cvkit-show-yolo-seg = "cvkit.show_yolo_seg_image:main_cli"
cvkit-video2image = "cvkit.video2image:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cvkit"]
