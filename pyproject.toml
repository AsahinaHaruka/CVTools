[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvtool"
version = "0.1.0"
description = "A computer vision toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Haruka" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "tqdm>=4.67.1",
    "opencv-python>=4.7.0.72",
    "numpy>=1.23.0"
]

[project.optional-dependencies]
onnx-core = [
    "onnx>=1.19.1",
    "onnxslim>=0.1.74",
]
onnx-cpu = [
    "cvtool[onnx-core]",
    "onnxruntime>=1.23.2"
]
onnx-gpu = [
    "cvtool[onnx-core]",
    "onnxruntime-gpu>=1.23.2"
]
sam = [
    "regex"
]

[project.scripts]
cvtool-color-to-gray = "cvtool.color_to_gray:main"
cvtool-data-split = "cvtool.data_split:main"
cvtool-random-selection = "cvtool.random_selection:main"
cvtool-show-yolo-obj = "cvtool.show_yolo_obj_image:main_cli"
cvtool-show-yolo-seg = "cvtool.show_yolo_seg_image:main_cli"
cvtool-video2image = "cvtool.video2image:main"
